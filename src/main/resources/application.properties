spring.application.name=restfulapi

# Base de datos H2 en memoria. El esquema lo crea schema.sql y los datos de ejemplo data.sql.
spring.datasource.url=jdbc:h2:mem:nisum
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123
spring.h2.console.enabled=true

spring.sql.init.mode=always
# Hibernate no crea tablas: solo valida que las entidades coincidan con schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Formato de la contrasenia (expresion regular configurable)
registerapi.constants.passregexp=[A-Za-z0-9]{6,64}

# JWT: el secreto debe tener al menos 32 caracteres. En produccion se sobrescribe con la variable de entorno JWT_SECRET
registerapi.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
registerapi.jwt.expiration-minutes=15