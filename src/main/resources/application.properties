
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:nisum
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace

logging.level.org.springframework.web=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always

registerapi.constants.passregexp=[A-Za-z0-9]{6,64}

# JWT: el secreto debe tener al menos 32 caracteres.
registerapi.jwt.secret=${JWT_SECRET:secreto-desarrollo-cambiar-prod-0123456789}
registerapi.jwt.expiration-minutes=15